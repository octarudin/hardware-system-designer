name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: hardware_system_designer_test
          POSTGRES_USER: hwsd
          POSTGRES_PASSWORD: hwsd_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hwsd -d hardware_system_designer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hwsd:hwsd_ci_only@127.0.0.1:5432/hardware_system_designer_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Validate schema assets
        run: pnpm test:schema

      - name: Run unit and architecture tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Apply migration in an isolated schema
        run: pnpm db:migrate:smoke
